workflows:
  ios-workflow:
    name: LexAid iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd frontend-web
          npm install --legacy-peer-deps
      - name: Build React app
        script: |
          cd frontend-web
          npx react-scripts build
      - name: Sync Capacitor iOS
        script: |
          cd frontend-web
          npx cap sync ios
      - name: Build Unsigned iOS App
        script: |
          cd frontend-web/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - frontend-web/ios/App/build/Build/Products/Release-iphoneos/*.app
      - frontend-web/ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - suvansenthils@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: LexAid Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          cd frontend-web
          npm install --legacy-peer-deps
      - name: Build React app
        script: |
          cd frontend-web
          npx react-scripts build
      - name: Sync Capacitor Android
        script: |
          cd frontend-web
          npx cap add android || true
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd frontend-web/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - frontend-web/android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - suvansenthils@gmail.com
        notify:
          success: true
          failure: true
