name: 1. Selenium Web E2E Testing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "selenium-web-e2e-${{ github.ref }}"
  cancel-in-progress: true

env:
  BASE_URL: "https://suvan789.github.io/lexaid/"
  PASS_THRESHOLD: "95.0"
  HEADLESS: "true"

jobs:
  build-and-deploy:
    name: "Build React App & Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: |
          cd frontend-web
          npm install --ignore-scripts --legacy-peer-deps

      - name: Build Application
        run: |
          cd frontend-web
          GENERATE_SOURCEMAP=false REACT_APP_API_URL=https://lexaid-api.onrender.com CI=false npm run build
          cp build/index.html build/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend-web/build
          publish_branch: gh-pages
          force_orphan: true

  selenium-e2e-tests:
    name: "Run 470+ Selenium E2E Web Tests"
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install -r automation/selenium/requirements.txt

      - name: Setup Headless Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Execute Selenium E2E Tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          HEADLESS: "true"
          BUILD_NUMBER: "BUILD-${{ github.run_number }}"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PASS_THRESHOLD: ${{ env.PASS_THRESHOLD }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          PYTHONPATH: "."
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python automation/selenium/run_selenium_tests.py
        continue-on-error: true

      - name: Upload E2E Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "Selenium-E2E-Reports-BUILD-${{ github.run_number }}"
          path: |
            automation/selenium/reports/HTML/
            automation/selenium/reports/Excel/
            automation/selenium/reports/JSON/
          retention-days: 30
