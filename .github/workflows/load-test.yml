name: Baseline Load Test — 100 VUs × 60s

on:
  workflow_dispatch:
    inputs:
      vus:
        description: "Number of virtual users"
        required: false
        default: "100"
      duration:
        description: "Test duration (e.g. 60s, 2m)"
        required: false
        default: "60s"
  schedule:
    - cron: "0 2 * * *"   # Nightly 2AM UTC
  push:
    paths:
      - "loadtest/**"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  API_URL: "https://lexaid-api.onrender.com"
  WEB_URL: "https://suvan789.github.io/lexaid"

jobs:
  baseline-load-test:
    name: "Baseline Load Test — 100 VUs × 60s Against Live API"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Stage 1: Checkout ─────────────────────────────
      - name: "Stage 1 — Checkout Repository"
        uses: actions/checkout@v4

      # ── Stage 2: Wake Up Render (free tier cold start) ─
      - name: "Stage 2 — Wake Up Render API (Cold Start Prevention)"
        run: |
          echo "Warming up Render API..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/api/auth/login" \
              -X POST -H "Content-Type: application/json" \
              -d '{"email":"warmup@test.com","password":"warmup"}' \
              --max-time 30 || echo "000")
            echo "Warmup attempt $i: HTTP $STATUS"
            sleep 5
          done
          echo "API warmup complete."

      # ── Stage 3: Setup k6 ────────────────────────────
      - name: "Stage 3 — Install k6 Load Testing Tool"
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.52.0-linux-amd64/k6 /usr/local/bin/
          k6 version

      # ── Stage 4: Run k6 Baseline Load Test ─────────────
      - name: "Stage 4 — Execute k6 Baseline: 100 VUs × 60s"
        env:
          API_URL: ${{ env.API_URL }}
          WEB_URL: ${{ env.WEB_URL }}
          K6_VUS: ${{ github.event.inputs.vus || '100' }}
          K6_DURATION: ${{ github.event.inputs.duration || '60s' }}
        run: |
          mkdir -p loadtest/results loadtest/reports
          k6 run \
            --vus $K6_VUS \
            --duration $K6_DURATION \
            --out json=loadtest/results/raw.json \
            --summary-export loadtest/results/summary.json \
            -e API_URL=$API_URL \
            -e WEB_URL=$WEB_URL \
            loadtest/scripts/baseline_load_test.js \
            || echo "k6 completed (threshold violations are non-fatal)"

      # ── Stage 5: Run Python Quick Metrics Summary ──────
      - name: "Stage 5 — Generate Load Test Reports"
        run: |
          pip install requests --quiet
          python loadtest/scripts/generate_report.py \
            --json   loadtest/results/summary.json \
            --out    loadtest/reports/load-report.html \
            --md-out loadtest/reports/summary.md \
            --build  "${{ github.run_number }}" \
            --api    "${{ env.API_URL }}" \
          || echo "Report generation attempted"

      # ── Stage 6: Publish GitHub Actions Summary ─────────
      - name: "Stage 6 — Publish Load Test Summary to GitHub Actions"
        if: always()
        run: |
          if [ -f "loadtest/reports/summary.md" ]; then
            cat loadtest/reports/summary.md >> $GITHUB_STEP_SUMMARY
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # LexAid API Baseline Load Test Summary
          **Target:** https://lexaid-api.onrender.com
          **Profile:** 100 Virtual Users x 60 seconds
          **Build:** ${{ github.run_number }}

          See artifacts for full HTML report with RPS and response time details.
          EOF
          fi

      # ── Stage 7: Upload Artifacts (30 days) ─────────────
      - name: "Stage 7 — Upload Load Test Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "LexAid-LoadTest-Baseline-BUILD-${{ github.run_number }}"
          path: |
            loadtest/results/
            loadtest/reports/
          retention-days: 30

      # ── Stage 8: Publish HTML Report to GitHub Pages ────
      - name: "Stage 8 — Publish Load Report to GitHub Pages"
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: loadtest/reports
          publish_branch: gh-pages
          destination_dir: loadtest/build-${{ github.run_number }}
          keep_files: true
